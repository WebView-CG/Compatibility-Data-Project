---
layout: default
---
<div class="post">
	<div class="post-inside">
		<p class="post-date">{{ page.date | date: '%B %d, %Y' }}{% if page.author %} by {{ page.author }}{% endif %}</p>
		<h1 class="post-title">{{ page.title | markdownify | remove: '<p>' | remove: '</p>' }}</h1>
		{{ content | markdownify }}
	</div>
</div>
